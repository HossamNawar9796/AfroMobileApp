<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<!-- أهم سطر للـ Responsive -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar Booking</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    padding: 0;
    text-align: center;
    background: linear-gradient(135deg,#fff7cc,#ffffff);
}

/* الكونتينر الرئيسي */
.calendar {
    width: 100%;
    max-width: 400px;
    margin: auto;
    padding: 15px;
    box-sizing: border-box;
}

/* اللوجو */
.logo {
    width: 70px;
    max-width: 30%;
}

/* الهيدر */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
}

/* الأيام والتواريخ */
.days, .dates {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    width: 100%;
}

.days div {
    font-size: 12px;
    font-weight: bold;
}

.dates div {
    padding: 8px 0;
    font-size: 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.dates div:hover {
    transform: scale(1.05);
}

/* الحالات */
.available { background: #d4edda; }
.booked { background: #f8d7da; }

.selected {
    border: 2px solid black;
}

.result {
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
}

/* الفورم */
select, input, textarea {
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    padding: 8px;
    border-radius: 8px;
}

/* الزرار */
button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: orange;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.booking-item {
    background:#eee;
    margin:5px;
    padding:5px;
    border-radius:8px;
    font-size:13px;
}
</style>

</head>

<body>

<div class="calendar">

    <!-- اللوجو -->
    <img src="helper.png" class="logo">

    <div class="header">
        <button onclick="prevMonth()">⬅</button>

        <div>
            <span id="monthName"></span>
            <select id="yearSelect" onchange="changeYear()"></select>
        </div>

        <button onclick="nextMonth()">➡</button>
    </div>

    <!-- أيام الأسبوع -->
    <div class="days">
        <div>الأحد</div><div>الإثنين</div><div>الثلاثاء</div>
        <div>الأربعاء</div><div>الخميس</div><div>الجمعة</div><div>السبت</div>
    </div>

    <!-- التواريخ -->
    <div class="dates" id="dates"></div>

    <!-- النتيجة -->
    <div class="result" id="result">اختار يوم 👆</div>

    <!-- فورم الحجز -->
    <div id="bookingForm" style="display:none;">

        <input type="time" id="time">

        <textarea id="note" placeholder="ملاحظات"></textarea>

        <select id="payment">
            <option value="كاش">كاش</option>
            <option value="إنستا باي">إنستا باي</option>
            <option value="فودافون كاش">فودافون كاش</option>
        </select>

        <button onclick="saveBooking()">تأكيد الحجز</button>

        <div id="bookingsList"></div>

    </div>

</div>

<script>

let date = new Date();
let selectedKey = null;

let bookings = JSON.parse(localStorage.getItem("bookings")) || {};

const months = [
"يناير","فبراير","مارس","أبريل","مايو","يونيو",
"يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"
];

const daysNames = [
"الأحد","الإثنين","الثلاثاء","الأربعاء",
"الخميس","الجمعة","السبت"
];

function initYears() {
    let select = document.getElementById("yearSelect");
    for(let y = 2020; y <= 2035; y++){
        let option = document.createElement("option");
        option.value = y;
        option.text = y;
        select.appendChild(option);
    }
}

function renderCalendar() {

    let year = date.getFullYear();
    let month = date.getMonth();

    document.getElementById("monthName").innerText = months[month];
    document.getElementById("yearSelect").value = year;

    let firstDay = new Date(year, month, 1).getDay();
    let lastDate = new Date(year, month + 1, 0).getDate();

    let container = document.getElementById("dates");
    container.innerHTML = "";

    for(let i=0; i<firstDay; i++){
        container.innerHTML += "<div></div>";
    }

    for(let d=1; d<=lastDate; d++){

        let div = document.createElement("div");
        div.innerText = d;

        let key = `${year}-${month+1}-${d}`;

        if(bookings[key]){
            div.classList.add("booked");
        } else {
            div.classList.add("available");
        }

        div.onclick = function(){
            selectDate(d, div, key);
        };

        container.appendChild(div);
    }
}

function selectDate(day, element, key){

    document.querySelectorAll(".dates div")
    .forEach(d => d.classList.remove("selected"));

    element.classList.add("selected");

    selectedKey = key;

    let selectedDate = new Date(
        date.getFullYear(),
        date.getMonth(),
        day
    );

    document.getElementById("result").innerText =
        daysNames[selectedDate.getDay()] +
        " - " +
        day + "/" +
        (date.getMonth()+1) + "/" +
        date.getFullYear();

    document.getElementById("bookingForm").style.display = "block";

    showBookings();
}

function showBookings(){

    let list = document.getElementById("bookingsList");
    list.innerHTML = "";

    if(bookings[selectedKey]){
        bookings[selectedKey].forEach(b => {
            let item = document.createElement("div");
            item.className = "booking-item";
            item.innerText =
                "⏰ " + b.time +
                " | 💰 " + b.payment +
                " | 📝 " + b.note;
            list.appendChild(item);
        });
    }
}

function saveBooking(){

    let time = document.getElementById("time").value;
    let note = document.getElementById("note").value;
    let payment = document.getElementById("payment").value;

    if(!time){
        alert("اختار الساعة");
        return;
    }

    let newBooking = { time, note, payment };

    if(!bookings[selectedKey]){
        bookings[selectedKey] = [];
    }

    bookings[selectedKey].push(newBooking);

    localStorage.setItem("bookings", JSON.stringify(bookings));

    renderCalendar();
    showBookings();

    document.getElementById("note").value = "";
}

function changeYear(){
    date.setFullYear(document.getElementById("yearSelect").value);
    renderCalendar();
}

function nextMonth(){
    date.setMonth(date.getMonth()+1);
    renderCalendar();
}

function prevMonth(){
    date.setMonth(date.getMonth()-1);
    renderCalendar();
}

initYears();
renderCalendar();

</script>

</body>
</html>
